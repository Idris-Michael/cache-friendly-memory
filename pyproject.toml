[project]
name = "cache-friendly-memory"
version = "0.1.0"
description = "Chat memory that keeps the prompt cache warm: recent turns verbatim, older turns distilled in batches."
readme = "README.md"
authors = [{ name = "Idris-Michael Bakare" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cache_memory"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"bench/**" = ["S603"]  # bench calls the claude CLI with an argv list

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cache_memory --cov-report=term-missing --cov-fail-under=90"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
